name: Build & Run StyleCop

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Get Changed Lines
      uses: hestonhoffman/changed-lines@v1

    - name: Print changed lines
      run: echo ${{ steps.changed_lines.outputs.changed_lines }}

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: |
        dotnet restore/
        dotnet add Content.Client package StyleCop.Analyzers --version 1.2.0-beta.556

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m
